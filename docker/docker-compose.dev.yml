# ============================================================================
# Development Docker Compose for Todo Application
# Next.js dev server + PostgreSQL container + volume mounts
# ============================================================================

version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Next.js Development Server
  # --------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: todo-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229"  # Node.js debug port
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/todo_app_dev
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - REDIS_URL=redis://redis:6379
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot reload
      - ../:/app
      # Use named volume for node_modules to avoid conflicts
      - node_modules:/app/node_modules
      # Use named volume for Next.js cache
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - todo-network-dev
    command: ["npm", "run", "dev"]

  # --------------------------------------------------------------------------
  # PostgreSQL Database (Development)
  # --------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: todo-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=todo_app_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - todo-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Redis Cache & Rate Limiting (Development)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: todo-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - todo-network-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru

  # --------------------------------------------------------------------------
  # Database Migration Runner (Development)
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: todo-migrate-dev
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/todo_app_dev
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network-dev
    command: ["npx", "prisma", "migrate", "dev", "--name", "init"]
    profiles:
      - migrate

  # --------------------------------------------------------------------------
  # Database Seeder (Development)
  # --------------------------------------------------------------------------
  seed:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: todo-seed-dev
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/todo_app_dev
      - NODE_ENV=development
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network-dev
    command: ["npm", "run", "db:seed"]
    profiles:
      - seed

  # --------------------------------------------------------------------------
  # Prisma Studio (Development Database GUI)
  # --------------------------------------------------------------------------
  studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: todo-studio-dev
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/todo_app_dev
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network-dev
    command: ["npx", "prisma", "studio", "--port", "5555", "--hostname", "0.0.0.0"]
    profiles:
      - studio

# ----------------------------------------------------------------------------
# Networks
# ----------------------------------------------------------------------------
networks:
  todo-network-dev:
    driver: bridge

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  node_modules:
    driver: local
  next_cache:
    driver: local
